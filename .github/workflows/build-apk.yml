name: Build APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Check required files
        run: |
          test -f "Correct_file_mobile_apk.html"
          test -f "icon.png"

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@7 @capacitor/cli@7 @capacitor/android@7

      - name: Prepare HTML app
        run: |
          mkdir -p www
          cp "Correct_file_mobile_apk.html" "www/index.html"

      - name: Create Capacitor configuration
        run: |
          cat > capacitor.config.json <<'EOF'
          {
            "appId": "com.earnlyappk.app",
            "appName": "EarnlyAppk",
            "webDir": "www",
            "server": {
              "androidScheme": "https"
            }
          }
          EOF

      - name: Create Android project
        run: npx cap add android

      - name: Configure Android launcher icon from icon.png
        run: |
          python3 -m pip install --quiet Pillow

          python3 <<'PY'
          from PIL import Image
          from pathlib import Path

          src = Image.open("icon.png").convert("RGBA")

          sizes = {
              "mdpi": 48,
              "hdpi": 72,
              "xhdpi": 96,
              "xxhdpi": 144,
              "xxxhdpi": 192,
          }

          for density, size in sizes.items():
              out = Path(f"android/app/src/main/res/mipmap-{density}")
              out.mkdir(parents=True, exist_ok=True)

              img = src.copy()
              img.thumbnail((size, size), Image.Resampling.LANCZOS)

              canvas = Image.new("RGBA", (size, size), (0, 0, 0, 0))
              canvas.alpha_composite(
                  img,
                  ((size - img.width) // 2, (size - img.height) // 2)
              )

              canvas.save(out / "ic_launcher.png")
              canvas.save(out / "ic_launcher_round.png")

          fg_dir = Path("android/app/src/main/res/drawable")
          fg_dir.mkdir(parents=True, exist_ok=True)

          fg_size = 432
          fg = Image.new("RGBA", (fg_size, fg_size), (0, 0, 0, 0))
          logo = src.copy()
          logo.thumbnail((280, 280), Image.Resampling.LANCZOS)
          fg.alpha_composite(
              logo,
              ((fg_size - logo.width) // 2, (fg_size - logo.height) // 2)
          )
          fg.save(fg_dir / "ic_launcher_foreground.png")

          values = Path("android/app/src/main/res/values")
          values.mkdir(parents=True, exist_ok=True)

          (values / "colors.xml").write_text(
              '''<?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#07111F</color>
          </resources>
          ''',
              encoding="utf-8"
          )

          anydpi = Path("android/app/src/main/res/mipmap-anydpi-v26")
          anydpi.mkdir(parents=True, exist_ok=True)

          adaptive = '''<?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@drawable/ic_launcher_foreground"/>
          </adaptive-icon>
          '''

          (anydpi / "ic_launcher.xml").write_text(adaptive, encoding="utf-8")
          (anydpi / "ic_launcher_round.xml").write_text(adaptive, encoding="utf-8")
          PY

      - name: Copy HTML into Android
        run: npx cap copy android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EarnlyApp-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

